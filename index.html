<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemática 3D - Navegador Espacial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Reset e Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            overflow: hidden;
            height: 100vh;
        }

        /* Cabeçalho do Jogo */
        .game-header {
            background: linear-gradient(90deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 15px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .header-container {
            display: flex;
            gap: 30px;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .header-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-item label {
            font-weight: 600;
            white-space: nowrap;
        }

        .header-item select,
        .header-item input {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            color: #333;
            min-width: 150px;
        }

        .header-item input[readonly] {
            background: #ecf0f1;
            cursor: not-allowed;
        }

        .header-item select:focus,
        .header-item input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
        }

        #nivel-info {
            font-size: 16px;
            font-weight: 600;
            padding: 8px 16px;
            background: rgba(52, 152, 219, 0.2);
            border-radius: 4px;
        }

        /* Container Principal */
        .game-container {
            display: flex;
            height: calc(100vh - 70px);
            gap: 0;
        }

        /* Canvas 3D */
        #canvas-container {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Painel de Controle */
        .control-panel {
            width: 350px;
            background: white;
            overflow-y: auto;
            box-shadow: -4px 0 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-left: 4px solid #3498db;
        }

        .panel-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ecf0f1;
        }

        .panel-section:last-child {
            border-bottom: none;
        }

        .panel-section h3 {
            color: #2c3e50;
            font-size: 16px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-section p {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }

        /* Campos de Entrada */
        #input-fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
        }

        .input-group input,
        .input-group select {
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        /* Feedback */
        .feedback {
            padding: 12px;
            border-radius: 4px;
            font-weight: 500;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .feedback.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Botões */
        .btn-primary,
        .btn-secondary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
            margin-bottom: 10px;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(127, 140, 141, 0.4);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        /* Barra de Progresso */
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60 0%, #2ecc71 100%);
            width: 0%;
            transition: width 0.3s;
        }

        #progresso-text {
            text-align: center;
            font-weight: 600;
            color: #27ae60;
        }

        /* Scroll Bar Customizado */
        .control-panel::-webkit-scrollbar {
            width: 8px;
        }

        .control-panel::-webkit-scrollbar-track {
            background: #ecf0f1;
        }

        .control-panel::-webkit-scrollbar-thumb {
            background: #bdc3c7;
            border-radius: 4px;
        }

        .control-panel::-webkit-scrollbar-thumb:hover {
            background: #95a5a6;
        }

        /* Responsividade */
        @media (max-width: 1024px) {
            .game-container {
                flex-direction: column;
            }

            .control-panel {
                width: 100%;
                max-height: 300px;
                border-left: none;
                border-top: 4px solid #3498db;
            }

            #canvas-container {
                flex: 1;
                min-height: 400px;
            }

            .header-container {
                gap: 15px;
            }

            .header-item {
                flex: 1;
                min-width: 150px;
            }
        }

        @media (max-width: 768px) {
            .game-header {
                padding: 10px 15px;
            }

            .header-container {
                gap: 10px;
                justify-content: space-between;
            }

            .header-item select,
            .header-item input {
                min-width: 100px;
                font-size: 12px;
            }

            .control-panel {
                padding: 15px;
            }

            .panel-section h3 {
                font-size: 14px;
            }

            .panel-section p {
                font-size: 12px;
            }

            .btn-primary,
            .btn-secondary {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Cabeçalho do Jogo -->
    <header class="game-header">
        <div class="header-container">
            <div class="header-item">
                <label for="aluno-select">Aluno:</label>
                <select id="aluno-select">
                    <option value="">Selecione um aluno</option>
                </select>
            </div>
            <div class="header-item">
                <label for="turma-input">Turma:</label>
                <input type="text" id="turma-input" readonly>
            </div>
            <div class="header-item">
                <label for="data-input">Data:</label>
                <input type="date" id="data-input" readonly>
            </div>
            <div class="header-item">
                <span id="nivel-info">Nível: 1/10</span>
            </div>
        </div>
    </header>

    <!-- Container Principal do Jogo -->
    <main class="game-container">
        <!-- Canvas 3D -->
        <div id="canvas-container"></div>

        <!-- Painel de Controle e Informações -->
        <aside class="control-panel">
            <div class="panel-section">
                <h3>Objetivo do Nível</h3>
                <p id="objetivo-text">Carregando...</p>
            </div>

            <div class="panel-section">
                <h3>Instruções</h3>
                <p id="instrucoes-text">Carregando...</p>
            </div>

            <div class="panel-section">
                <h3>Entrada de Dados</h3>
                <div id="input-fields">
                    <!-- Campos de entrada dinâmicos serão inseridos aqui -->
                </div>
            </div>

            <div class="panel-section">
                <h3>Feedback</h3>
                <p id="feedback-text" class="feedback"></p>
            </div>

            <div class="panel-section">
                <button id="enviar-resposta" class="btn-primary">Enviar Resposta</button>
                <button id="proximo-nivel" class="btn-secondary" style="display:none;">Próximo Nível</button>
                <button id="reiniciar-nivel" class="btn-secondary" style="display:none;">Reiniciar Nível</button>
            </div>

            <div class="panel-section">
                <h3>Progresso</h3>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p id="progresso-text">0%</p>
            </div>
        </aside>
    </main>

    <script>
        /**
         * Script para gerenciar os dados dos alunos e preencher o cabeçalho do jogo
         */

        // Dados dos alunos (será carregado do JSON)
        let alunosData = [];

        /**
         * Carrega os dados dos alunos do arquivo JSON
         */
        async function carregarAlunos() {
            try {
                // Dados dos alunos em formato JSON
                alunosData = [
                    {"Nome": "ÁGATHA NIKOLLE DA SILVA RAMOS", "Turma": "9ºA"},
                    {"Nome": "AMANDA BEATRIZ LEAL MOURAD", "Turma": "9ºA"},
                    {"Nome": "ANNA NICOLY BENVINDO DOS SANTOS", "Turma": "9ºA"},
                    {"Nome": "ARTHUR DOS SANTOS", "Turma": "9ºA"},
                    {"Nome": "BEATRIZ UCHOA DOS SANTOS", "Turma": "9ºA"},
                    {"Nome": "BRUNO EDUARDO NOGUEIRA DE OLIVEIRA", "Turma": "9ºA"},
                    {"Nome": "CARLOS EDUARDO BELMIRO DOS SANTOS", "Turma": "9ºA"},
                    {"Nome": "CHRISTIAN DAVI DE OLIVEIRA", "Turma": "9ºA"},
                    {"Nome": "FILIPE RODRIGUES SANTOS", "Turma": "9ºA"},
                    {"Nome": "GABRIEL ALMEIDA MOSCARDINI", "Turma": "9ºA"},
                    {"Nome": "GIOVANA MOTA VAZ DE JESUS", "Turma": "9ºA"},
                    {"Nome": "GUILHERME DA SILVA GUIMARÃES", "Turma": "9ºA"},
                    {"Nome": "HELOÍSA LEAL DOS REIS", "Turma": "9ºA"},
                    {"Nome": "IAGO ANJOS DE JESUS", "Turma": "9ºA"},
                    {"Nome": "IGNACIO LINS SANTOS", "Turma": "9ºA"},
                    {"Nome": "ISADORA DE SOUZA SILVA", "Turma": "9ºA"},
                    {"Nome": "JOAO VICTOR BATISTA DUARTE", "Turma": "9ºA"},
                    {"Nome": "JULIANA SANTOS LIMA", "Turma": "9ºA"},
                    {"Nome": "MANUELA VITÓRIA LIMA DOS SANTOS", "Turma": "9ºA"},
                    {"Nome": "MIGUEL ALVES OLIVEIRA", "Turma": "9ºA"},
                    {"Nome": "ORIANA JOSE TUAREZ RENGEL", "Turma": "9ºA"},
                    {"Nome": "RAFAELLA VITÓRIA EXPEDITA DE ANDRADE MARQUES", "Turma": "9ºA"},
                    {"Nome": "RAYLAN DE JESUS BARBOSA", "Turma": "9ºA"},
                    {"Nome": "REBECA DOS SANTOS SOUSA", "Turma": "9ºA"},
                    {"Nome": "RICHARD JOSÉ DOS SANTOS", "Turma": "9ºA"},
                    {"Nome": "SARA CRISTINA PASSOS MARTINS", "Turma": "9ºA"},
                    {"Nome": "VANESSA CARDOSO DOS SANTOS", "Turma": "9ºA"},
                    {"Nome": "JULIA DIAS AZEVEDO", "Turma": "9ºA"},
                    {"Nome": "SAMARA HELEN DA SILVA", "Turma": "9ºA"},
                    {"Nome": "LUIS MATHEUS DA SILVA RAMOS", "Turma": "9ºA"},
                    {"Nome": "FABIO HENRIQUE DA SILVA", "Turma": "9ºA"},
                    {"Nome": "SOPHIA MIRELLA BRAGA GARCIA", "Turma": "9ºA"}
                ];
                
                preencherDropdownAlunos();
                console.log(`${alunosData.length} alunos carregados com sucesso.`);
            } catch (error) {
                console.error('Erro ao carregar dados dos alunos:', error);
                // Fallback: usar dados de exemplo
                alunosData = [
                    { Nome: 'ÁGATHA NIKOLLE DA SILVA RAMOS', Turma: '9ºA' },
                    { Nome: 'AMANDA BEATRIZ LEAL MOURAD', Turma: '9ºA' },
                    { Nome: 'ANNA NICOLY BENVINDO DOS SANTOS', Turma: '9ºA' },
                    { Nome: 'ARTHUR DOS SANTOS', Turma: '9ºA' },
                    { Nome: 'BEATRIZ UCHOA DOS SANTOS', Turma: '9ºA' }
                ];
                preencherDropdownAlunos();
            }
        }

        /**
         * Preenche o dropdown de alunos com os dados carregados
         */
        function preencherDropdownAlunos() {
            const selectElement = document.getElementById('aluno-select');
            selectElement.innerHTML = '<option value="">Selecione um aluno</option>';

            alunosData.forEach((aluno, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = aluno.Nome;
                selectElement.appendChild(option);
            });

            // Adicionar event listener para atualizar turma e data
            selectElement.addEventListener('change', atualizarTurmaEData);
        }

        /**
         * Atualiza o campo de turma e data quando um aluno é selecionado
         */
        function atualizarTurmaEData() {
            const selectElement = document.getElementById('aluno-select');
            const turmaInput = document.getElementById('turma-input');
            const dataInput = document.getElementById('data-input');

            if (selectElement.value === '') {
                turmaInput.value = '';
                dataInput.value = '';
            } else {
                const alunoIndex = parseInt(selectElement.value);
                const aluno = alunosData[alunoIndex];
                turmaInput.value = aluno.Turma;
                
                // Preencher com a data atual
                const hoje = new Date();
                const ano = hoje.getFullYear();
                const mes = String(hoje.getMonth() + 1).padStart(2, '0');
                const dia = String(hoje.getDate()).padStart(2, '0');
                dataInput.value = `${ano}-${mes}-${dia}`;
            }
        }

        /**
         * Retorna os dados do aluno selecionado
         */
        function getAlunoSelecionado() {
            const selectElement = document.getElementById('aluno-select');
            if (selectElement.value === '') {
                return null;
            }
            const alunoIndex = parseInt(selectElement.value);
            return alunosData[alunoIndex];
        }

        /**
         * Retorna todos os dados dos alunos
         */
        function getTodosAlunos() {
            return alunosData;
        }

        // Carregar alunos quando a página for carregada
        document.addEventListener('DOMContentLoaded', carregarAlunos);
    </script>

    <script>
        /**
         * Script principal do jogo "Cinemática 3D - Navegador Espacial"
         * Gerencia a lógica do jogo, renderização 3D e progressão de níveis
         */

        // Variáveis globais
        let scene, camera, renderer;
        let nivelAtual = 1;
        let respostaCorreta = false;
        let pontuacao = 0;
        let nivelConcluido = false;

        // Definição dos 10 níveis
        const niveis = [
            {
                id: 1,
                titulo: 'Nível 1: Referencial e Repouso/Movimento',
                objetivo: 'Identificar qual dos três objetos (A, B, C) está em repouso em relação ao referencial móvel (a sonda).',

                instrucoes: 'Insira as coordenadas (X, Y, Z) para posicionar a sonda a 5 unidades de distância do Ponto A (origem).',
                tipo: 'coordenadas-3d',
                coordenadas: { x: 3, y: 4, z: 0 }, // Uma das respostas corretas

                tipo: 'calculo-distancia',

                instrucoes: 'A sonda vai de A a B (10 km) e volta a A. Calcule: (1) Distância Total Percorrida, (2) Deslocamento.',

                pontoCorreto: 3, // Índice do ponto (0-4)
                opcoes: ['Ponto 1', 'Ponto 2', 'Ponto 3', 'Ponto 4', 'Ponto 5'],

            {
                id: 10,

                objetivo: 'Calcular a Velocidade Média Total de um percurso dividido em dois trechos.',

                tipo: 'velocidade-media-total',
                velocidadeCorreta: 110,
                tolerancia: 1,
                descricao: 'Competência BNCC: EF09FI04 - Aplicar as equações horárias relacionadas ao movimento.'

        /**
         * Inicializa a cena 3D com Three.js
         */
        function inicializarCena3D() {
            const container = document.getElementById('canvas-container');

            // Criar cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x667eea);

            // Criar câmera
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            // Criar renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Adicionar iluminação
            const luz = new THREE.DirectionalLight(0xffffff, 1);
            luz.position.set(5, 10, 7);
            luz.castShadow = true;
            scene.add(luz);

            const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(luzAmbiente);

            // Adicionar grid de referência
            const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0xcccccc);
            scene.add(gridHelper);

            // Adicionar eixos de referência
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            // Inicializar o primeiro nível
            carregarNivel(nivelAtual);

            // Animar cena
            animate();

            // Adicionar event listener para redimensionar
            window.addEventListener('resize', onWindowResize);
        }

        /**
         * Carrega o nível especificado
         */
        function carregarNivel(numeroNivel) {
            // Limpar cena
            while (scene.children.length > 0) {
                scene.remove(scene.children[0]);
            }

            // Re-adicionar elementos básicos
            const luz = new THREE.DirectionalLight(0xffffff, 1);
            luz.position.set(5, 10, 7);
            luz.castShadow = true;
            scene.add(luz);

            const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(luzAmbiente);

            const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0xcccccc);
            scene.add(gridHelper);

            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            // Obter dados do nível
            const nivel = niveis[numeroNivel - 1];
            nivelAtual = numeroNivel;
            respostaCorreta = false;
            nivelConcluido = false;

            // Atualizar interface
            document.getElementById('nivel-info').textContent = `Nível: ${numeroNivel}/10`;
            document.getElementById('objetivo-text').textContent = nivel.objetivo;
            document.getElementById('instrucoes-text').textContent = nivel.instrucoes;
            document.getElementById('feedback-text').textContent = '';
            document.getElementById('feedback-text').className = 'feedback';

            // Mostrar/ocultar botões
            document.getElementById('enviar-resposta').style.display = 'block';
            document.getElementById('proximo-nivel').style.display = 'none';
            document.getElementById('reiniciar-nivel').style.display = 'none';

            // Atualizar barra de progresso
            const progresso = (numeroNivel / 10) * 100;
            document.getElementById('progress-fill').style.width = progresso + '%';
            document.getElementById('progresso-text').textContent = Math.round(progresso) + '%';

            // Criar campos de entrada específicos do nível
            criarCamposEntrada(nivel);

            // Criar objetos 3D específicos do nível
            criarObjetosDonivel(nivel);
        }

                    nivel.opcoes.forEach((opcao, index) => {
                        const div = document.createElement('div');
                        div.className = 'input-group';
                        div.innerHTML = `
                            <label>
                                <input type="radio" name="resposta" value="${index}"> ${opcao}
                            </label>
                        `;
                        inputFields.appendChild(div);
                    });
                    break;

                case 'coordenadas-3d':
                    const coordDiv = document.createElement('div');
                    coordDiv.className = 'input-group';
                    coordDiv.innerHTML = `
                        <label>Coordenada X:</label>
                        <input type="number" id="coord-x" placeholder="Ex: 3" step="0.1">
                        <label>Coordenada Y:</label>
                        <input type="number" id="coord-y" placeholder="Ex: 4" step="0.1">
                        <label>Coordenada Z:</label>
                        <input type="number" id="coord-z" placeholder="Ex: 0" step="0.1">

                    calcDiv.className = 'input-group';
                    calcDiv.innerHTML = `
                        <label>${nivel.tipo === 'calculo-distancia' ? 'Distância Total (unidades):' : 
                                nivel.tipo === 'velocidade-media' ? 'Velocidade Média (km/h):' :
                                nivel.tipo === 'conversao-unidades' ? 'Velocidade (m/s):' :
                                nivel.tipo === 'posicao-final' ? 'Posição Final (m):' :
                                'Velocidade Média Total (km/h):'}</label>
                        <input type="number" id="resposta-valor" placeholder="Insira o valor" step="0.1">
                    `;
                    inputFields.appendChild(calcDiv);
                    break;

                case 'deslocamento-3d':
                    const deslDiv = document.createElement('div');
                    deslDiv.className = 'input-group';
                    deslDiv.innerHTML = `
                        <label>Deslocamento ΔX:</label>
                        <input type="number" id="desl-x" placeholder="Ex: 3" step="0.1">
                        <label>Deslocamento ΔY:</label>
                        <input type="number" id="desl-y" placeholder="Ex: 4" step="0.1">

        /**
         * Nível 1: Referencial e Repouso/Movimento
         */
        function criarNivel1() {
            // Sonda (referencial móvel)
            const sondaGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const sondaMaterial = new THREE.MeshStandardMaterial({ color: 0xff6b6b });
            const sonda = new THREE.Mesh(sondaGeometry, sondaMaterial);
            sonda.position.set(0, 0, 0);
            sonda.castShadow = true;
            scene.add(sonda);

            // Objeto A (em repouso em relação à sonda)
            const objAGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const objAMaterial = new THREE.MeshStandardMaterial({ color: 0x4ecdc4 });
            const objA = new THREE.Mesh(objAGeometry, objAMaterial);
            objA.position.set(3, 0, 0);
            objA.castShadow = true;
            scene.add(objA);

            // Objeto B (em movimento)
            const objBGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const objBMaterial = new THREE.MeshStandardMaterial({ color: 0xffe66d });
            const objB = new THREE.Mesh(objBGeometry, objBMaterial);
            objB.position.set(-3, 0, 0);
            objB.castShadow = true;
            scene.add(objB);

            // Objeto C (em movimento)
            const objCGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const objCMaterial = new THREE.MeshStandardMaterial({ color: 0x95e1d3 });
            const objC = new THREE.Mesh(objCGeometry, objCMaterial);
            objC.position.set(0, 3, 0);
            objC.castShadow = true;
            scene.add(objC);

            // Animar objetos B e C
            let animationFrame = 0;
            const originalAnimate = animate;
            animate = function() {
                animationFrame++;
                objB.position.x = -3 + Math.sin(animationFrame * 0.01) * 2;
                objC.position.y = 3 + Math.cos(animationFrame * 0.01) * 1.5;
                originalAnimate();
            };
        }

        /**
         * Valida a resposta do jogador e fornece feedback
         */
        function validarResposta() {
            const nivel = niveis[nivelAtual - 1];
            const feedbackElement = document.getElementById('feedback-text');
            let resposta = null;
            let acertou = false;

            switch (nivel.tipo) {
                case 'multipla-escolha':
                case 'velocidade-instantanea':
                    const radioSelecionado = document.querySelector('input[name="resposta"]:checked');
                    if (!radioSelecionado) {
                        feedbackElement.textContent = 'Por favor, selecione uma opção.';
                        feedbackElement.className = 'feedback error';
                        return;
                    }
                    resposta = parseInt(radioSelecionado.value);
                    acertou = resposta === nivel.respostaCorreta || resposta === nivel.pontoCorreto;
                    break;

                case 'coordenadas-3d':
                    const x = parseFloat(document.getElementById('coord-x').value);
                    const y = parseFloat(document.getElementById('coord-y').value);
                    const z = parseFloat(document.getElementById('coord-z').value);
                    if (isNaN(x) || isNaN(y) || isNaN(z)) {
                        feedbackElement.textContent = 'Por favor, insira valores válidos para X, Y e Z.';
                        feedbackElement.className = 'feedback error';
                        return;
                    }
                    const distancia = Math.sqrt(x * x + y * y + z * z);
                    acertou = Math.abs(distancia - 5) <= nivel.tolerancia;
                    resposta = { x, y, z, distancia };
                    break;

                case 'calculo-distancia':
                case 'velocidade-media':
                case 'conversao-unidades':
                case 'posicao-final':
                case 'velocidade-media-total':
                    const valor = parseFloat(document.getElementById('resposta-valor').value);
                    if (isNaN(valor)) {
                        feedbackElement.textContent = 'Por favor, insira um valor válido.';
                        feedbackElement.className = 'feedback error';
                        return;
                    }
                    const valorCorreto = nivel.tipo === 'calculo-distancia' ? nivel.distanciaCorreta :
                                          nivel.tipo === 'velocidade-media' ? nivel.velocidadeCorreta :
                                          nivel.tipo === 'conversao-unidades' ? nivel.velocidadeCorreta :
                                          nivel.tipo === 'posicao-final' ? nivel.posicaoCorreta :
                                          nivel.velocidadeCorreta;
                    acertou = Math.abs(valor - valorCorreto) <= nivel.tolerancia;
                    resposta = valor;
                    break;

                case 'deslocamento-3d':
                    const dx = parseFloat(document.getElementById('desl-x').value);
                    const dy = parseFloat(document.getElementById('desl-y').value);
                    const dz = parseFloat(document.getElementById('desl-z').value);
                    if (isNaN(dx) || isNaN(dy) || isNaN(dz)) {
                        feedbackElement.textContent = 'Por favor, insira valores válidos para ΔX, ΔY e ΔZ.';
                        feedbackElement.className = 'feedback error';
                        return;
                    }
                    acertou = Math.abs(dx - nivel.deslocamento.x) <= nivel.tolerancia &&
                              Math.abs(dy - nivel.deslocamento.y) <= nivel.tolerancia &&
                              Math.abs(dz - nivel.deslocamento.z) <= nivel.tolerancia;
                    resposta = { dx, dy, dz };
                    break;

                case 'distancia-vs-deslocamento':
                    const distTotal = parseFloat(document.getElementById('distancia-total').value);
                    const desl = parseFloat(document.getElementById('deslocamento-valor').value);
                    if (isNaN(distTotal) || isNaN(desl)) {
                        feedbackElement.textContent = 'Por favor, insira valores válidos.';
                        feedbackElement.className = 'feedback error';
                        return;
                    }
                    acertou = Math.abs(distTotal - nivel.distanciaTotal) <= nivel.tolerancia &&
                              Math.abs(desl - nivel.deslocamento) <= nivel.tolerancia;
                    resposta = { distTotal, desl };
                    break;
            }

            // Fornecer feedback
            if (acertou) {
                feedbackElement.textContent = '✓ Resposta correta! Parabéns!';
                feedbackElement.className = 'feedback success';
                nivelConcluido = true;
                pontuacao += 10;

                // Mostrar botão de próximo nível
                document.getElementById('enviar-resposta').style.display = 'none';
                if (nivelAtual < 10) {
                    document.getElementById('proximo-nivel').style.display = 'block';
                } else {
                    document.getElementById('proximo-nivel').textContent = 'Jogo Concluído!';
                    document.getElementById('proximo-nivel').style.display = 'block';
                }
            } else {
                feedbackElement.textContent = '✗ Resposta incorreta. Tente novamente!';
                feedbackElement.className = 'feedback error';
                document.getElementById('reiniciar-nivel').style.display = 'block';
            }
        }

        /**
         * Avança para o próximo nível
         */
        function proximoNivel() {
            if (nivelAtual < 10) {
                carregarNivel(nivelAtual + 1);
            } else {
                // Jogo concluído
                alert(`Parabéns! Você completou o jogo! Pontuação final: ${pontuacao}`);
                carregarNivel(1);
            }
        }

        /**
         * Reinicia o nível atual
         */
        function reiniciarNivel() {
            carregarNivel(nivelAtual);
        }

        /**
         * Anima a cena
         */
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        /**
         * Redimensiona a janela
         */
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            inicializarCena3D();

            document.getElementById('enviar-resposta').addEventListener('click', validarResposta);
            document.getElementById('proximo-nivel').addEventListener('click', proximoNivel);
            document.getElementById('reiniciar-nivel').addEventListener('click', reiniciarNivel);
        });
    </script>
</body>
</html>
